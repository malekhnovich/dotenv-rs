name: Feature request
description: Suggest an improvement or describe a missing use case.
title: "[Feature]: "
body:
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: Describe the concrete use case and your current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: If this exists in python-dotenv, include a small example of its behavior.
    validations:
      required: true
