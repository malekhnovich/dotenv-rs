name: CI
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check python tests benchmarks scripts examples
      - run: uv run python examples/demo.py
      - run: uv run pytest
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: uv run maturin build --release --out dist
      - run: uv run maturin sdist --out dist
      - name: Verify wheel and source installations
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run python scripts/verify_artifact.py "$artifact"
          done
      - run: uv run twine check --strict dist/*
        shell: bash
