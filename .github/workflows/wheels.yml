name: Portable wheels
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --out release-dist ${{ runner.os == 'Linux' && '-i python3.10' || '' }}
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          for wheel in release-dist/*.whl; do
            uv run --no-project python scripts/verify_artifact.py "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: release-dist/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: release-dist/*.tar.gz
          if-no-files-found: error
