[package]
name = "dotenv-rs-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Rust parsing core for a Python dotenv package"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py39"] }
regex = "1"

[features]
extension-module = ["pyo3/extension-module"]
