[package]
name = "dotenv-rs-python"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Rust parsing core for a Python dotenv package"
repository = "https://github.com/malekhnovich/dotenv-rs"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]
