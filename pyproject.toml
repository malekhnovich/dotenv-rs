[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "dotenv-rs"
version = "0.1.0"
description = "A Rust-powered dotenv parser for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Rust", "Programming Language :: Python :: 3"]

[dependency-groups]
dev = ["pytest>=8", "python-dotenv>=1.2,<2", "maturin>=1.8,<2", "ruff>=0.11"]

[tool.maturin]
python-source = "python"
module-name = "dotenv_rs._core"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
